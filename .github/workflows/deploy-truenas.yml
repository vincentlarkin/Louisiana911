name: Deploy to TrueNAS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Serialize production swaps; never cancel an in-progress deployment.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@05c58255396c88c609919d571a8b117099c69020 # v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy through restricted SSH account
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/deploy-key.XXXXXX")"
          hosts_file="$(mktemp "$RUNNER_TEMP/deploy-hosts.XXXXXX")"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh -T -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=truenas-deploy \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$hosts_file" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -l "$DEPLOY_SSH_USER" "$SSH_HOST" "deploy $GITHUB_SHA"

      - name: Notify search engines via IndexNow
        continue-on-error: true
        run: |
          curl --fail-with-body --retry 3 --retry-delay 2 \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data @- \
            'https://api.indexnow.org/indexnow' <<'JSON'
          {
            "host": "louisiana911.com",
            "key": "8c88ff3574d43eedfc084b1f6733a571",
            "keyLocation": "https://louisiana911.com/8c88ff3574d43eedfc084b1f6733a571.txt",
            "urlList": [
              "https://louisiana911.com/",
              "https://louisiana911.com/caddo911/",
              "https://louisiana911.com/coverage/",
              "https://louisiana911.com/coverage/baton-rouge/",
              "https://louisiana911.com/coverage/lafayette/",
              "https://louisiana911.com/coverage/new-orleans/",
              "https://louisiana911.com/about/",
              "https://louisiana911.com/reports/",
              "https://louisiana911.com/reports/monthly/"
            ]
          }
          JSON

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check workflow logs for details."
