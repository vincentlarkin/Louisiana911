# Louisiana map tile server, served by the site's nginx at /basemap/.
# MAP_TILES_DIR holds config.yaml and the two .versatiles files written by
# update-map-tiles.sh. The container joins nginx's Docker network and
# publishes no port of its own.
services:
  louisiana911-maps:
    # Pinned; bump deliberately (see README.md, "Upgrading").
    image: versatiles/versatiles-frontend:v5.3.0-alpine
    container_name: louisiana911-maps
    entrypoint: ["/sbin/tini", "--", "/app/versatiles", "serve", "-c", "/data/config.yaml"]
    volumes:
      - ${MAP_TILES_DIR:?set MAP_TILES_DIR}:/data:ro
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
    name: ${MAP_TILES_NETWORK:-ix-my-website_default}
