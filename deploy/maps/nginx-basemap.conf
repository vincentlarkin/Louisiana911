# Add inside each louisiana911.com server block (port 80 and 443), before
# "location /". Serves the Louisiana tiles, styles, fonts and sprites at
# https://louisiana911.com/basemap/ from the louisiana911-maps container.
location ^~ /basemap/ {
    set $louisiana911_maps http://louisiana911-maps:8080;
    rewrite ^/basemap/(.*)$ /$1 break;
    proxy_pass $louisiana911_maps;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    limit_except GET HEAD { deny all; }
}
